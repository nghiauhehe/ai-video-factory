<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kie.ai Claude Client</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked.js for parsing Markdown in AI responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Markdown Styles */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 600;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }
        .markdown-body p {
            margin-bottom: 1em;
            line-height: 1.6;
        }
        .markdown-body code {
            background-color: #334155;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.9em;
        }
        .markdown-body pre {
            background-color: #1e293b;
            padding: 1em;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1em;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 1em;
        }
        .markdown-body a {
            color: #38bdf8;
            text-decoration: underline;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <div class="max-w-4xl w-full flex flex-col gap-6">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Kie.ai Claude API</h1>
                <p class="text-slate-400 text-sm mt-1">Interact with claude-fable-5 and tool calling</p>
            </div>
            <div id="status-badge" class="px-3 py-1 rounded-full text-sm font-medium bg-slate-700 text-slate-300 border border-slate-600">
                Ready
            </div>
        </header>

        <!-- Settings & Configuration -->
        <section class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 flex flex-col gap-4">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Token Input -->
                <div class="flex flex-col gap-1">
                    <label for="api-token" class="text-sm font-medium text-slate-400">API Token (Bearer)</label>
                    <input type="password" id="api-token" placeholder="Enter your token here..." 
                        class="bg-slate-900 border border-slate-600 text-white rounded-lg p-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                </div>
                <!-- Model Input -->
                <div class="flex flex-col gap-1">
                    <label for="model-name" class="text-sm font-medium text-slate-400">Model</label>
                    <input type="text" id="model-name" value="claude-fable-5" 
                        class="bg-slate-900 border border-slate-600 text-white rounded-lg p-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                </div>
                <!-- Thinking Flag -->
                <div class="flex flex-col gap-1 md:col-span-2">
                    <label for="thinking-flag" class="text-sm font-medium text-slate-400">Thinking Mode (Fable 5)</label>
                    <select id="thinking-flag" class="bg-slate-900 border border-slate-600 text-white rounded-lg p-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                        <option value="true" selected>Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- User Input Area -->
        <section class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 flex flex-col gap-4">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Your Input</h2>

            <!-- Text Prompt -->
            <div class="flex flex-col gap-1">
                <label for="prompt-text" class="text-sm font-medium text-slate-400">Prompt / Question</label>
                <textarea id="prompt-text" rows="4" placeholder="What is the weather like in Boston today?" 
                    class="bg-slate-900 border border-slate-600 text-white rounded-lg p-2.5 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors resize-y"></textarea>
            </div>

            <!-- Error Message Box -->
            <div id="error-box" class="hidden bg-red-900/50 border border-red-500 text-red-200 p-3 rounded-lg text-sm break-words">
                <!-- Error text goes here -->
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end mt-2">
                <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-6 rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg id="loading-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="btn-text">Send Request</span>
                </button>
            </div>
        </section>

        <!-- Output Area -->
        <section id="output-section" class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 hidden flex-col gap-4">
            <div class="flex items-center justify-between border-b border-slate-700 pb-2">
                <h2 class="text-lg font-semibold text-slate-200">AI Response</h2>
                <!-- Stats chips -->
                <div id="stats-container" class="flex gap-2 text-xs">
                    <span id="stat-tokens" class="bg-purple-900/50 text-purple-300 border border-purple-700/50 px-2 py-1 rounded">Tokens: 0</span>
                    <span id="stat-credits" class="bg-emerald-900/50 text-emerald-300 border border-emerald-700/50 px-2 py-1 rounded">Credits: 0.0</span>
                </div>
            </div>

            <!-- Content Area -->
            <div id="response-content" class="markdown-body text-slate-300 min-h-[100px] bg-slate-900 p-4 rounded-lg border border-slate-700 break-words">
                <!-- Response gets rendered here -->
            </div>

            <!-- Raw JSON Toggle (Optional for debugging) -->
            <details class="mt-2 group">
                <summary class="text-xs text-slate-500 cursor-pointer hover:text-slate-300 transition-colors list-none flex items-center gap-1">
                    <svg class="w-3 h-3 group-open:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    View Raw JSON Response
                </summary>
                <pre id="raw-json" class="mt-2 text-xs bg-black text-slate-400 p-3 rounded overflow-x-auto border border-slate-800"></pre>
            </details>
        </section>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const elements = {
                token: document.getElementById('api-token'),
                model: document.getElementById('model-name'),
                thinking: document.getElementById('thinking-flag'),
                promptText: document.getElementById('prompt-text'),
                sendBtn: document.getElementById('send-btn'),
                btnText: document.getElementById('btn-text'),
                spinner: document.getElementById('loading-spinner'),
                errorBox: document.getElementById('error-box'),
                statusBadge: document.getElementById('status-badge'),
                outputSection: document.getElementById('output-section'),
                responseContent: document.getElementById('response-content'),
                statTokens: document.getElementById('stat-tokens'),
                statCredits: document.getElementById('stat-credits'),
                rawJson: document.getElementById('raw-json')
            };

            // Load saved token from localStorage
            const savedToken = localStorage.getItem('kie_api_token');
            if (savedToken) {
                elements.token.value = savedToken;
            }

            function setUIState(state, message = '') {
                if (state === 'loading') {
                    elements.sendBtn.disabled = true;
                    elements.spinner.classList.remove('hidden');
                    elements.btnText.textContent = 'Processing...';
                    elements.errorBox.classList.add('hidden');
                    elements.statusBadge.textContent = 'Requesting...';
                    elements.statusBadge.className = 'px-3 py-1 rounded-full text-sm font-medium bg-blue-900/50 text-blue-300 border border-blue-700/50 animate-pulse';
                    elements.outputSection.classList.add('hidden');
                } else if (state === 'error') {
                    elements.sendBtn.disabled = false;
                    elements.spinner.classList.add('hidden');
                    elements.btnText.textContent = 'Send Request';
                    elements.errorBox.classList.remove('hidden');
                    elements.errorBox.textContent = message;
                    elements.statusBadge.textContent = 'Failed';
                    elements.statusBadge.className = 'px-3 py-1 rounded-full text-sm font-medium bg-red-900/50 text-red-300 border border-red-700/50';
                } else if (state === 'success') {
                    elements.sendBtn.disabled = false;
                    elements.spinner.classList.add('hidden');
                    elements.btnText.textContent = 'Send Request';
                    elements.errorBox.classList.add('hidden');
                    elements.statusBadge.textContent = 'Completed';
                    elements.statusBadge.className = 'px-3 py-1 rounded-full text-sm font-medium bg-emerald-900/50 text-emerald-300 border border-emerald-700/50';
                    elements.outputSection.classList.remove('hidden');
                    elements.outputSection.classList.add('flex');
                }
            }

            elements.sendBtn.addEventListener('click', async () => {
                const token = elements.token.value.trim();
                const model = elements.model.value.trim() || 'claude-fable-5';
                const prompt = elements.promptText.value.trim();
                const thinkingFlag = elements.thinking.value === 'true';

                if (!token) {
                    setUIState('error', 'API Token is required.');
                    return;
                }
                if (!prompt) {
                    setUIState('error', 'Please provide a text prompt.');
                    return;
                }

                // Save token for future use
                localStorage.setItem('kie_api_token', token);

                // Construct Request Payload based on Claude curl schema
                const payload = {
                    model: model,
                    messages: [
                        {
                            role: "user",
                            content: prompt
                        }
                    ],
                    thinkingFlag: thinkingFlag,
                    stream: false,
                    max_tokens: 4096
                };

                setUIState('loading');

                try {
                    const response = await fetch('https://api.kie.ai/claude/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.text();
                        throw new Error(`HTTP Error ${response.status}: ${errData}`);
                    }

                    // Parse standard JSON block since stream=false
                    const responseData = await response.json();
                    
                    elements.rawJson.textContent = JSON.stringify(responseData, null, 2);
                    
                    let htmlOutput = '';
                    
                    // Claude responses return a content array which may contain 'text' or 'tool_use' blocks
                    if (responseData.content && Array.isArray(responseData.content)) {
                        responseData.content.forEach(block => {
                            if (block.type === 'text') {
                                htmlOutput += marked.parse(block.text);
                            } else if (block.type === 'tool_use') {
                                // Beautiful formatting for Tool Use blocks
                                htmlOutput += `
                                <div class="bg-slate-700/50 p-4 rounded-xl border border-slate-600 my-4">
                                    <div class="flex items-center gap-2 text-sm text-blue-400 font-mono mb-3 font-semibold">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                        Tool Invoked: ${block.name}
                                    </div>
                                    <div class="text-xs text-slate-400 mb-1">Arguments:</div>
                                    <pre class="text-sm bg-slate-900 p-3 rounded-lg text-emerald-300 overflow-x-auto border border-slate-800 font-mono">${JSON.stringify(block.input, null, 2)}</pre>
                                </div>`;
                            }
                        });
                    }

                    if (!htmlOutput) {
                        htmlOutput = "<p class='text-slate-400 italic'>No content returned or unhandled stop reason.</p>";
                    }

                    elements.responseContent.innerHTML = htmlOutput;

                    // Update UI stats from the new JSON layout
                    const usage = responseData.usage || {};
                    const credits = responseData.credits_consumed || 0;
                    const inTokens = usage.input_tokens || 0;
                    const outTokens = usage.output_tokens || 0;
                    
                    elements.statTokens.textContent = `Tokens: ${inTokens} In / ${outTokens} Out`;
                    elements.statCredits.textContent = `Credits: ${credits}`;

                    setUIState('success');

                } catch (error) {
                    console.error("API Request Failed:", error);
                    setUIState('error', error.message || 'An error occurred during the request.');
                }
            });
        });
    </script>
</body>
</html>
